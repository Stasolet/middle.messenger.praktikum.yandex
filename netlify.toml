[build]
  command = "npm run build"
  publish = "dist"

# Чистые URL для многостраничного приложения (без слэша -> каталог страницы)
[[redirects]]
  from = "/login"
  to = "/login/"
  status = 200

[[redirects]]
  from = "/signin"
  to = "/signin/"
  status = 200

[[redirects]]
  from = "/chat"
  to = "/chat/"
  status = 200

[[redirects]]
  from = "/profile"
  to = "/profile/"
  status = 200

# Fallback на кастомную страницу 404
[[redirects]]
  from = "/*"
  to = "/error_404/"
  status = 404
